name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format

      - name: Check src formatting
        run: |
          set -euo pipefail

          find src -type d \( \
              -path src/user/applications/nyancat -o \
              -path src/user/applications/fire -o \
              -path src/user/applications/gears -o \
              -path src/user/applications/chess -o \
              -path src/modules/drivers/cdi -o \
              -path src/modules/drivers/common/cdi -o \
              -path src/modules/system/config/sqlite3 -o \
              -path src/modules/subsys/posix/musl -o \
              -path src/modules/subsys/posix/include -o \
              -path src/modules/subsys/posix/newlib -o \
              -path src/system/kernel/debugger/libudis86 -o \
              -path src/system/kernel/machine/mach_pc/x86emu -o \
              -path src/modules/system/lwip/api -o \
              -path src/modules/system/lwip/core -o \
              -path src/modules/system/lwip/include -o \
              -path src/modules/system/lwip/netif \
            \) -prune -o -type f \( \
              -path src/modules/subsys/posix/glue-dlmalloc.c \
            \) -prune -o \( \
              -name '*.cc' -o -name '*.h' -o -name '*.c' \
              -o -name '*.cpp' -o -name '*.cxx' -o -name '*.hpp' \
            \) -print0 | \
            xargs -0 clang-format --style=file --dry-run --Werror

  buildutil-tests:
    name: buildutil testsuite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bison \
            clang \
            cmake \
            flex \
            libssl-dev \
            nasm \
            ninja-build

      - name: Configure native host utilities
        run: |
          cmake -S . -B build/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPEDIGREE_WARNINGS=ON \
            -DPEDIGREE_BUILDUTILS_ASAN=OFF \
            -DPEDIGREE_BUILDUTILS_PROFILE=Speed

      - name: Build buildutil testsuite
        run: cmake --build build/host --target testsuite --parallel

      - name: Run CTest
        run: ctest --test-dir build/host --output-on-failure --no-tests=error

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      TIDY_TOOLCHAIN_ROOT: ${{ runner.temp }}/pedigree-clang-tidy-toolchain
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bison \
            binutils \
            clang \
            clang-tidy \
            cmake \
            flex \
            g++ \
            gcc \
            libssl-dev \
            nasm \
            ninja-build

      - name: Configure host utility exporters
        run: |
          cmake -S . -B build/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPEDIGREE_WARNINGS=ON \
            -DPEDIGREE_BUILDUTILS_ASAN=OFF \
            -DPEDIGREE_BUILDUTILS_PROFILE=Speed

      - name: Build host utility exporters
        run: cmake --build build/host --target headerify ext2img keymap memorytracer --parallel

      - name: Prepare host compiler shim
        run: |
          set -euo pipefail

          mkdir -p "$TIDY_TOOLCHAIN_ROOT/bin"
          ln -s "$(command -v clang)" \
            "$TIDY_TOOLCHAIN_ROOT/bin/x86_64-pedigree-gcc"
          ln -s "$(command -v clang++)" \
            "$TIDY_TOOLCHAIN_ROOT/bin/x86_64-pedigree-g++"
          ln -s "$(command -v objcopy)" \
            "$TIDY_TOOLCHAIN_ROOT/bin/x86_64-pedigree-objcopy"
          ln -s "$(command -v strip)" \
            "$TIDY_TOOLCHAIN_ROOT/bin/x86_64-pedigree-strip"

      - name: Configure full hosted compilation database
        run: |
          cmake -S . -B build/tidy -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build-etc/cmake/pedigree_hosted.cmake" \
            -DPEDIGREE_TOOLCHAIN_ROOT="$TIDY_TOOLCHAIN_ROOT" \
            -DIMPORT_EXECUTABLES="$GITHUB_WORKSPACE/build/host/HostUtilities.cmake" \
            -DPEDIGREE_BUILD_USER_DIR=OFF \
            -DPEDIGREE_HOSTED_DYNAMIC_MODULES=ON \
            -DPEDIGREE_HOSTED_SMOKE_TESTS=OFF \
            -DPEDIGREE_WITH_INIT=OFF \
            -DPEDIGREE_WARNINGS=ON

      - name: Run clang-tidy across the hosted kernel and modules
        run: |
          set -euo pipefail

          cxx_version="$(g++ -dumpversion)"
          cxx_include_dir="/usr/include/c++/$cxx_version"
          cxx_target_include_dir="/usr/include/$(gcc -dumpmachine)/c++/$cxx_version"
          test -d "$cxx_include_dir"
          test -d "$cxx_target_include_dir"

          source_filter='.*\/src\/(system\/kernel(?!\/debugger\/libudis86(?:\/|$)|\/machine\/mach_pc\/x86emu(?:\/|$))|modules\/(?!drivers\/(?:cdi|common\/cdi)(?:\/|$)|subsys\/posix\/(?:musl|include|newlib)(?:\/|$)|system\/config\/sqlite3(?:\/|$)|system\/lwip\/(?:api|core|include|netif)(?:\/|$)))'

          run-clang-tidy \
            -p build/tidy \
            -config-file "$GITHUB_WORKSPACE/src/.clang-tidy" \
            -removed-arg=-march=k8 \
            -removed-arg="--sysroot=$TIDY_TOOLCHAIN_ROOT/x86_64-pedigree" \
            -extra-arg-before=--gcc-toolchain=/usr \
            -extra-arg-before=-isystem \
            -extra-arg-before="$cxx_include_dir" \
            -extra-arg-before=-isystem \
            -extra-arg-before="$cxx_target_include_dir" \
            -source-filter="$source_filter" \
            -warnings-as-errors='*' \
            -j 2 \
            '.*/src/.*'
