set timeout=1
set default=0

insmod all_video
insmod font
insmod gfxterm
loadfont unicode
set gfxmode=1024x768,800x600,640x480,auto
set gfxpayload=keep
terminal_output gfxterm

insmod part_gpt
insmod part_msdos
insmod fat
insmod search
insmod search_fs_file
insmod chain

menuentry 'Pedigree (current)' {
    search --no-floppy --file --set=esp /EFI/PEDIGREE/current/BOOTX64.EFI
    chainloader ($esp)/EFI/PEDIGREE/current/BOOTX64.EFI current
    boot
}

menuentry 'Pedigree (known good)' {
    search --no-floppy --file --set=esp /EFI/PEDIGREE/known-good/BOOTX64.EFI
    chainloader ($esp)/EFI/PEDIGREE/known-good/BOOTX64.EFI known-good
    boot
}

menuentry 'Boot rescue USB' {
    search --no-floppy --removable --file --set=rescue /EFI/BOOT/BOOTX64.EFI
    chainloader ($rescue)/EFI/BOOT/BOOTX64.EFI
    boot
}
